global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']

  - job_name: 'rag-service'
    static_configs:
      - targets: ['rag-service:8002']

  - job_name: 'ingestion-service'
    static_configs:
      - targets: ['ingestion-service:8001']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
